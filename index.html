<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Heart</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background-color: #000;
    display: flex;
    justify-content: center;
    align-items: center;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
}

.instruction {
    position: absolute;
    color: rgba(255, 255, 255, 0.5);
    font-family: Arial, sans-serif;
    font-size: 18px;
    letter-spacing: 2px;
    pointer-events: none;
    text-align: center;
}

.instruction span {
    display: inline-block;
    margin-top: 10px;
    animation: softBlink 2s ease-in-out infinite;
    text-shadow: 0 0 8px rgba(255, 255, 255, 0.7);
}

@keyframes softBlink {
    0%, 100% {
        opacity: 0.4;
    }

    50% {
        opacity: 1;
    }
}

</style>
</head>
<body>
<canvas id="heartCanvas"></canvas>

<div class="instruction">
    You are my person ❤️
    <br>
    <span>(Click)</span>
</div>

<script>
const canvas = document.getElementById("heartCanvas");
const ctx = canvas.getContext("2d");

let particles = [];
let currentHue = Math.random() * 360;
let clicked = false;


// Ajustar el canvas al tamaño de la pantalla
function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resizeCanvas();


// Clase de las partículas
class Particle {

    constructor(x, y, targetX, targetY, hue) {

        this.x = x;
        this.y = y;

        this.targetX = targetX;
        this.targetY = targetY;

        this.size = Math.random() * 3 + 1;
        this.speed = Math.random() * 0.08 + 0.04;
        this.alpha = 1;

        this.color = `hsl(${hue}, 100%, 65%)`;
    }

    update() {

        // La partícula se mueve hacia su posición del corazón
        this.x += (this.targetX - this.x) * this.speed;
        this.y += (this.targetY - this.y) * this.speed;

        // Después de llegar al corazón comienza a desaparecer
        this.alpha -= 0.006;
    }

    draw() {

        ctx.save();

        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;

        // Brillo de la partícula
        ctx.shadowBlur = 15;
        ctx.shadowColor = this.color;

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.size,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.restore();
    }
}


// Fórmula para crear la forma del corazón
function getHeartPoint(t, scale) {

    const x = 16 * Math.pow(Math.sin(t), 3);

    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

    return {
        x: x * scale,
        y: -y * scale
    };
}


// Crear el corazón
function createHeart(startX, startY) {

    particles = [];

    currentHue = (currentHue + 60) % 360;

    const scale =
        Math.min(canvas.width, canvas.height) * 0.014;

    // Crear las partículas del corazón
    for (
        let t = 0;
        t < Math.PI * 2;
        t += 0.045
    ) {

        const heartPoint = getHeartPoint(t, scale);

        // Pequeñas variaciones para que se vea más natural
        const randomX = (Math.random() - 0.5) * 4;
        const randomY = (Math.random() - 0.5) * 4;

        const targetX =
            startX + heartPoint.x + randomX;

        const targetY =
            startY + heartPoint.y + randomY;

        particles.push(
            new Particle(
                startX,
                startY,
                targetX,
                targetY,
                currentHue
            )
        );
    }
}


// Detectar cuando el usuario hace click
window.addEventListener("click", function(event) {

    clicked = true;

    createHeart(
        event.clientX,
        event.clientY
    );

});


// Animación
function animate() {

    // Fondo con efecto de rastro
    ctx.fillStyle = "rgba(0, 0, 0, 0.18)";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    // Actualizar y dibujar partículas
    particles.forEach(
        (particle, index) => {

            particle.update();
            particle.draw();

            // Eliminar partículas que ya desaparecieron
            if (particle.alpha <= 0) {
                particles.splice(index, 1);
            }
        }
    );

    requestAnimationFrame(animate);
}

animate();


// Ajustar cuando cambia el tamaño de la ventana
window.addEventListener(
    "resize",
    resizeCanvas
);

</script>
</body>
</html>
